pre-commit:
  commands:
    lint-staged:
      run: pnpm exec lint-staged

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  skip:
    - CI
  parallel: true
  jobs:
    - name: checks
      run: pnpm exec lefthook run ci
      glob: '**/*.{ts,md,json,mdx}'

post-merge:
  commands:
    pnpm-install:
      run: pnpm install --frozen-lockfile
      glob: '{pnpm-lock.yaml,**/package.json}'

post-checkout:
  commands:
    pnpm-install:
      run: pnpm install --frozen-lockfile
      glob: '{pnpm-lock.yaml,**/package.json}'

pre-rebase:
  commands:
    checks:
      run: pnpm exec lefthook run ci

ci:
  parallel: true
  jobs:
    - name: lint
      run: pnpm --filter . run lint

    - name: check types
      run: pnpm --filter . run types:check

    - name: test coverage
      run: pnpm --filter . run test:coverage

    - name: build library
      run: pnpm --filter . run build

    - name: build docs
      run: pnpm --filter docs run build
